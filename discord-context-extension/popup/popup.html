<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Discord Context Saver</title>
<style>
  :root { --bg:#09090b; --card:#18181b; --muted:#a1a1aa; --text:#e4e4e7; --border:#27272a; --accent:#5865f2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,sans-serif; background:var(--bg); color:var(--text); width:520px; min-height:560px; }
  header { padding:10px 12px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  h1 { font-size:13px; margin:0; white-space:nowrap; }
  button { background:var(--card); border:1px solid var(--border); color:var(--text); padding:5px 9px; border-radius:6px; font-size:11px; cursor:pointer; }
  button:hover { background:#3f3f46; }
  button.primary { background:var(--accent); border-color:var(--accent); color:white; }
  #count { font-size:11px; color:var(--muted); }
  #debug { padding:6px 12px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--border); background:#111; white-space:pre-wrap; }
  #picker { border-bottom:1px solid var(--border); max-height:160px; overflow-y:auto; background:#0f0f12; }
  #pickerHead { display:flex; justify-content:space-between; align-items:center; padding:8px 12px 4px; font-size:11px; color:var(--muted); position:sticky; top:0; background:#0f0f12; z-index:1; }
  .chRow { display:flex; align-items:center; gap:8px; padding:6px 12px; font-size:12px; border-top:1px solid #1f1f23; cursor:pointer; }
  .chRow:hover { background:#1a1a1f; }
  .chRow input { accent-color:var(--accent); }
  .chName { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chCount { font-size:10px; color:var(--muted); background:var(--card); border:1px solid var(--border); border-radius:99px; padding:1px 6px; }
  #searchWrap { padding:6px 12px; border-bottom:1px solid var(--border); }
  #search { width:100%; background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 10px; font-size:12px; }
  #list { padding:10px 12px; overflow-y:auto; max-height:340px; display:flex; flex-direction:column; gap:8px; }
  .msg { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12px; white-space:pre-wrap; word-break:break-word; }
  .meta { font-size:10px; color:var(--muted); margin-top:4px; display:flex; justify-content:space-between; gap:8px; }
  .empty { color:var(--muted); text-align:center; padding-top:30px; font-size:13px; }
  .badge { font-size:10px; color:#a5b4fc; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Discord Context Saver</h1>
    <span id="count">0</span>
  </div>
  <div style="display:flex;gap:6px;align-items:center;">
    <button id="testBtn">Test</button>
    <button id="exportBtn">Export filtered</button>
    <button id="clear">Clear</button>
  </div>
</header>
<div id="debug">Loading…</div>

<div id="picker">
  <div id="pickerHead">
    <span>Conversations</span>
    <span style="display:flex;gap:6px;">
      <button id="selAll" style="padding:3px 7px;font-size:10px;">All</button>
      <button id="selNone" style="padding:3px 7px;font-size:10px;">None</button>
    </span>
  </div>
  <div id="chList"></div>
</div>

<div id="searchWrap"><input id="search" placeholder="Filter messages…" /></div>
<div id="list"><div class="empty">No messages saved yet. Open discord.com and scroll.</div></div>
<script src="popup.js"></script>
</body>
</html>
