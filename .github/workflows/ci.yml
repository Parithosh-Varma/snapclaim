name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run eval
      - name: smoke (mock backend)
        run: |
          npm run backend:start &>/tmp/snapclaim.log &
          SRV=$!
          sleep 2
          npm run backend:smoke
          kill $SRV
