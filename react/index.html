<!-- Browsers ignore frame-ancestors inside a <meta> CSP, so it is deliberately
  absent here — keeping it only logs a console warning. Frame embedding is
  blocked for real by react/public/_headers (a Content-Security-Policy response
  header, plus X-Frame-Options for old browsers). Keep the two policies in sync;
  tests/csp-headers.test.ts fails if they drift. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; connect-src 'self' https://snapclaim-backend.parithosh.workers.dev http://127.0.0.1:8787 http://localhost:8787 https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; media-src blob: data:; object-src 'none'; base-uri 'self'" />
